name: CI

# Runs on every push and pull request. The point is not coverage — it is that
# a release is currently built on one laptop with nothing checking it, so a
# broken analyze or a failing test can reach a signed bundle unnoticed.
#
# Kept to analyze + test on purpose. Building a release bundle here would need
# the upload keystore and key.properties as secrets, and putting a signing key
# into CI for a solo project buys less than it risks.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against. Floating
          # on 'stable' means a Flutter release can turn CI red on a day
          # nobody touched the code.
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` exits 1 whenever it finds anything at all, and
      # passing --no-fatal-infos alone does not change that — only adding
      # --no-fatal-warnings makes it exit 0, which would also stop real
      # warnings failing the build.
      #
      # So the exit code is ignored and the output is graded instead: the ~770
      # existing infos (avoid_print, deprecated withOpacity) are tolerated,
      # and any error or warning fails. Blocking every push on the infos today
      # would just teach everyone to ignore a red tick; letting a warning
      # through silently is the thing worth preventing.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt
          set -e
          if grep -qE '^[[:space:]]+(error|warning) -' analyze.txt; then
            echo "::error::flutter analyze reported errors or warnings"
            grep -E '^[[:space:]]+(error|warning) -' analyze.txt
            exit 1
          fi
          echo "No errors or warnings. Infos tolerated: $(grep -cE '^[[:space:]]+info -' analyze.txt)"

      - name: Test
        run: flutter test --reporter expanded

      # A debug APK compiles the whole app including the Android side, so it
      # catches Gradle and manifest breakage that analyze cannot see — the
      # Crashlytics plugin needing google-services 4.4.1+ was exactly that
      # class of failure, and it only appeared at build time.
      # android/app/google-services.json is gitignored, so the runner has no
      # Firebase config and the Google Services plugin refuses to run. That is
      # the whole reason this job has been red since September.
      #
      # The step below only needs to COMPILE the app, never to reach Firebase,
      # and the plugin is satisfied by any structurally valid file whose
      # package name matches. So write a placeholder when the real one is
      # absent — the Gradle and manifest breakage this step exists to catch
      # still gets caught, and no Firebase config has to live in the repo or
      # in a secret.
      #
      # The guard matters: if a real google-services.json is ever present
      # (a self-hosted runner, someone running this locally with act), it is
      # left alone.
      - name: Write a placeholder google-services.json
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "Real google-services.json present — leaving it alone."
            exit 0
          fi
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ustaad-ci-placeholder",
              "storage_bucket": "ustaad-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.ustaad.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "placeholder-key-not-valid-for-any-request"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "Placeholder written for com.ustaad.app."

      - name: Build debug APK
        run: flutter build apk --debug
